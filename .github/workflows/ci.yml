name: Package and contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      SCHALE_CACHE_DIR: ${{ github.workspace }}/.schale/ci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-default-groups --group test pytest tests/test_assets.py tests/test_inventory_onnx.py tests/test_dependency_policy.py tests/test_http_cache.py tests/test_inputs.py tests/test_toolkit.py tests/test_students.py tests/test_students_numeric.py tests/test_students_layout.py tests/test_students_inspector.py tests/test_distribution.py -q
      - run: uv build --no-sources
      - run: uv run --no-default-groups python scripts/check_distribution.py dist/schale-0.1.0-py3-none-any.whl dist/schale-0.1.0.tar.gz
      - run: uvx twine check --strict dist/schale-0.1.0-py3-none-any.whl dist/schale-0.1.0.tar.gz
